<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark Window Frame Background -->
  <rect width="64" height="64" rx="16" fill="#140e0b" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#d97706" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Window Panes (Blue/Slate monsoon tint) -->
  <rect x="10" y="10" width="20" height="20" rx="4" fill="#1e293b" fill-opacity="0.9" />
  <rect x="34" y="10" width="20" height="20" rx="4" fill="#1e293b" fill-opacity="0.9" />
  <rect x="10" y="34" width="20" height="20" rx="4" fill="#1e293b" fill-opacity="0.9" />
  <rect x="34" y="34" width="20" height="20" rx="4" fill="#1e293b" fill-opacity="0.9" />
  
  <!-- Warm Amber Radio Glow & Lamp Reflection -->
  <circle cx="20" cy="44" r="5" fill="#f59e0b" fill-opacity="0.8" />
  <circle cx="20" cy="44" r="9" fill="#f59e0b" fill-opacity="0.2" />

  <!-- Rain Drops falling on window -->
  <line x1="18" y1="14" x2="16" y2="22" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />
  <line x1="42" y1="16" x2="40" y2="24" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />
  <line x1="46" y1="38" x2="44" y2="48" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="24" cy="26" r="1.5" fill="#7dd3fc" />
  <circle cx="38" cy="42" r="1.5" fill="#7dd3fc" />

  <!-- Radio Waves -->
  <path d="M40 40 Q44 44 48 40" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" />
  <path d="M38 36 Q44 42 50 36" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
</svg>
